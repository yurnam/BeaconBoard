[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Flash configuration - CRITICAL: Must match your physical flash size!
; Most ESP32-S3 modules have 4MB flash (not 8MB)
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = default.csv
board_build.f_flash = 80000000L

; Build options
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_ENABLED=1
    -D CONFIG_SPIRAM_SUPPORT=1

; Flash settings - force 4MB with DIO mode
board_upload.flash_size = 4MB

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Libraries
lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.1
    bblanchon/ArduinoJson@^6.21.3

; Upload options - DIO mode is more compatible with various flash chips
upload_speed = 460800
upload_flags = 
    --before=default_reset
    --after=hard_reset
    --chip=esp32s3
    --flash_mode=dio
    --flash_freq=80m
    --flash_size=4MB
